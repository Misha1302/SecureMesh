[package]
name = "securemesh-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
openmls = "=0.9.2"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
openmls_traits = "=0.6.0"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tls_codec = "0.5"
uuid = { version = "1", features = ["v4"] }
