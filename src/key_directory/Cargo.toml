[package]
name = "securemesh-key-directory"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
ed25519-dalek = "=2.2.0"
tempfile = "=3.27.0"
async-trait = "=0.1.92"
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.9.2"
akd = { version = "=0.13.0", default-features = false, features = ["public_auditing", "whatsapp_v1", "serde_serialization"] }
anyhow = "=1.0.104"
protobuf = "=3.7.2"
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
securemesh-crypto = { path = "../crypto_core" }
hex = "=0.4.3"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }

# Keep the profile codec identical to crypto_core's SQLCipher 4.20.0 pin.
[patch.crates-io]
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "0f1ab7393ae5d62d44a94a5a5107c00b23d4ed58" }

[[example]]
name = "directory"
test = true
