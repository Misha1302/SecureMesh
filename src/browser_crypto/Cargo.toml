[package]
name = "securemesh-browser-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.22"
openmls = { version = "=0.10.0-rc.1", features = ["js"] }
openmls_basic_credential = "=0.7.0-rc.1"
openmls_rust_crypto = "=0.7.0-rc.1"
openmls_traits = "=0.7.0-rc.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tls_codec = "0.5"
unicode-segmentation = "=1.13.3"
uuid = { version = "1", features = ["v4", "js"] }
wasm-bindgen = "=0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
