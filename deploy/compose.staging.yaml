name: securemesh-staging
services:
  api:
    image: ${SECUREMESH_API_IMAGE:?Supply reviewed immutable image digest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      StateDirectory: /state
    env_file: ${SECUREMESH_RUNTIME_ENV_FILE:?External private config file required}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes: ["state:/state"]
    networks: [internal]
    # No published ports. Current API intentionally rejects Production startup.
  db:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: securemesh
      POSTGRES_USER: securemesh
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes: ["db:/var/lib/postgresql/data"]
    networks: [internal]
secrets:
  database_password:
    file: ${SECUREMESH_DATABASE_PASSWORD_FILE:?External private secret file required}
volumes:
  db:
  state:
networks:
  internal:
    internal: true
