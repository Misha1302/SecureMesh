name: securemesh
services:
  db:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_DB: securemesh
      POSTGRES_USER: securemesh
      POSTGRES_PASSWORD: ${SECUREMESH_DB_PASSWORD:?Run make bootstrap}
    ports: ["127.0.0.1:55438:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securemesh -d securemesh"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: ["no-new-privileges:true"]
  mailpit:
    image: axllent/mailpit:v1.27.10
    profiles: ["mail"]
    ports: ["127.0.0.1:58028:8025", "127.0.0.1:51028:1025"]
volumes:
  db:
networks:
  default:
    ipam:
      config:
        - subnet: ${SECUREMESH_SUBNET:-10.239.238.0/28}
