name: Package SecureMesh web app

on:
  pull_request:
    paths:
      - 'site/app/**'
      - 'scripts/package-pwa.py'
      - 'src/browser_crypto/**'
      - 'src/crypto_core/src/server_credential.rs'
      - '.github/workflows/pwa.yml'
  push:
    branches: [main]
    paths:
      - 'site/app/**'
      - 'scripts/package-pwa.py'
      - 'src/browser_crypto/**'
      - 'src/crypto_core/src/server_credential.rs'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            site/app
            scripts/package-pwa.py
            src/browser_crypto
            src/crypto_core/src/server_credential.rs
          sparse-checkout-cone-mode: false
      - name: Install pinned Rust and wasm-bindgen
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.100.0 install wasm-bindgen-cli --version 0.2.130 --locked --root "$RUNNER_TEMP/securemesh-wasm-cli"
          echo "$RUNNER_TEMP/securemesh-wasm-cli/bin" >> "$GITHUB_PATH"
      - name: Stage dedicated-origin bundle
        run: python3 scripts/package-pwa.py "$RUNNER_TEMP/securemesh-pwa"
      - name: Verify staged checksums
        run: |
          cd "$RUNNER_TEMP/securemesh-pwa"
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: securemesh-pwa
          path: ${{ runner.temp }}/securemesh-pwa/
          if-no-files-found: error
