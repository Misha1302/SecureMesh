name: local-checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: local-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt
      - run: make bootstrap
      - name: Install locked Flutter dependencies
        run: bash scripts/install-flutter.sh
      - name: Install dependency advisory scanner
        run: cargo install cargo-audit --version 0.23.0 --locked --root .local/security
      - name: Build the API for native network trials
        run: dotnet build src/SecureMesh.Api --no-restore
      - name: Measure candidate under GPRS packet loss
        id: gprs
        run: make native-network-gprs
      - name: Measure candidate under severe packet loss
        if: success() || steps.gprs.outcome == 'failure'
        id: severe
        run: make native-network-severe
      - name: Run acceptance and render measured results
        if: success() || steps.gprs.outcome == 'failure' || steps.severe.outcome == 'failure'
        run: make verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: reports/evidence
      - if: always()
        run: make down
