name: Publish SecureMesh guide
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: site
          persist-credentials: false
      - name: Verify public file list
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '100644 blob .nojekyll\n100644 blob index.html\n100644 blob linux-chat.png\n100644 blob product-status.json\n100644 blob render.py')
          actual=$(git ls-tree --format='%(objectmode) %(objecttype) %(path)' HEAD:site)
          [[ "$actual" == "$expected" ]]
          mkdir -p "$RUNNER_TEMP/public-site"
          python3 site/render.py "$RUNNER_TEMP/public-site/index.html"
          cp site/.nojekyll site/linux-chat.png "$RUNNER_TEMP/public-site/"
          tar -C "$RUNNER_TEMP/public-site" -cf "$RUNNER_TEMP/artifact.tar" ./.nojekyll ./index.html ./linux-chat.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
